quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Keep Jackson output compact and predictable for the Flutter client.
quarkus.jackson.serialization-inclusion=always

# Gameplay pacing (see GameConfig)
game29.bot-delay-ms=700
game29.round-pause-ms=3000
game29.quick-match-wait-ms=5000

%test.game29.bot-delay-ms=5
%test.game29.round-pause-ms=5
%test.game29.quick-match-wait-ms=50
